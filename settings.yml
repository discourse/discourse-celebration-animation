animation_images:
  type: objects
  default: []
  schema:
    name: image
    properties:
      image:
        type: upload
        required: true
      xOffset:
        type: float
        default: 0
      yOffset:
        type: float
        default: 0

animation_scale:
  type: float
  default: 1
  min: 0.1
  max: 5
  description: Size multiplier applied to every celebration image

animation_angle:
  type: float
  default: 0
  min: -180
  max: 180
  description: Rotation angle in degrees applied to every celebration image

display_mode:
  default: "first visit and first like or solution"
  type: enum
  choices:
    - "first visit"
    - "first like or solution"
    - "first visit and first like or solution"
    - "every other day and first solution"
  description: The animation will display once daily per browser, based on this action

test_groups:
  type: list
  list_type: group
  default: ""
  description: Members of these groups bypass celebration cooldowns. Leave empty for normal behavior.
